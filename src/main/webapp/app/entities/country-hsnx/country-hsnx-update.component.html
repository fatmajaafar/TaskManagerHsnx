<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-country-hsnx-heading" jhiTranslate="taskManagerHsnxApp.country.home.createOrEditLabel">Create or edit a Country</h2>

            <div>

                <div class="form-group" [hidden]="!editForm.get('id')!.value">
                    <mat-label for="id" jhiTranslate="global.field.id">ID</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="text"  id="id" name="id" formControlName="id" readonly />
                </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.country.countryName" for="field_countryName">Country Name</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="text"  name="countryName" id="field_countryName"
                           formControlName="countryName"/>
                    <div *ngIf="editForm.get('countryName')!.invalid && (editForm.get('countryName')!.dirty || editForm.get('countryName')!.touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('countryName')?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.country.countryCode" for="field_countryCode">Country Code</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="text"  name="countryCode" id="field_countryCode"
                           formControlName="countryCode"/>
                        </mat-form-field>
                </div>
            </div>

            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary" (click)="previousState()">
                    <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>

                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
