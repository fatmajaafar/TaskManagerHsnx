<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="-branch-hsnx-heading" jhiTranslate="taskManagerHsnxApp.branch.home.createOrEditLabel">Create or edit a Branch</h2>

            <div>

                <div class="form-group" [hidden]="!editForm.get('id')!.value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id" readonly />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchName" for="field_branchName">Branch Name</label>
                    <input type="text" class="form-control" name="branchName" id="field_branchName"
                           formControlName="branchName"/>
                    <div *ngIf="editForm.get('branchName')!.invalid && (editForm.get('branchName')!.dirty || editForm.get('branchName')!.touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('branchName')?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchPhone" for="field_branchPhone">Branch Phone</label>
                    <input type="text" class="form-control" name="branchPhone" id="field_branchPhone"
                           formControlName="branchPhone"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchFax" for="field_branchFax">Branch Fax</label>
                    <input type="text" class="form-control" name="branchFax" id="field_branchFax"
                           formControlName="branchFax"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchAddress" for="field_branchAddress">Branch Address</label>
                    <input type="text" class="form-control" name="branchAddress" id="field_branchAddress"
                           formControlName="branchAddress"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchEmail" for="field_branchEmail">Branch Email</label>
                    <input type="text" class="form-control" name="branchEmail" id="field_branchEmail"
                           formControlName="branchEmail"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchBanner" for="field_branchBanner">Branch Banner</label>
                    <input type="text" class="form-control" name="branchBanner" id="field_branchBanner"
                           formControlName="branchBanner"/>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchDefaultExercice" for="field_branchDefaultExercice">Branch Default Exercice</label>
                    <input type="number" class="form-control" name="branchDefaultExercice" id="field_branchDefaultExercice"
                           formControlName="branchDefaultExercice"/>
                </div>
            </div>

            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary" (click)="previousState()">
                    <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>

                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
