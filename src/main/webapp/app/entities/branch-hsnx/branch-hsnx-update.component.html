<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="-branch-hsnx-heading" jhiTranslate="taskManagerHsnxApp.branch.home.createOrEditLabel">Create or edit a Branch</h2>

            <div>

                <div class="form-group" [hidden]="!editForm.get('id')!.value">
                    <mat-label for="id" jhiTranslate="global.field.id">ID</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="text" class="form-control" id="id" name="id" formControlName="id" readonly />
                    </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchName" for="field_branchName">Branch Name</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="text"  name="branchName" id="field_branchName"
                           formControlName="branchName"/>
                    <div *ngIf="editForm.get('branchName')!.invalid && (editForm.get('branchName')!.dirty || editForm.get('branchName')!.touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('branchName')?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </mat-form-field>
                </div>
                
                <div class="form-group">
                    <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchPhone" for="field_branchPhone">Branch Phone</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="text" name="branchPhone" id="field_branchPhone"
                           formControlName="branchPhone"/>
                        </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchFax" for="field_branchFax">Branch Fax</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="text"  name="branchFax" id="field_branchFax"
                           formControlName="branchFax"/>
                    </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchAddress" for="field_branchAddress">Branch Address</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="text"  name="branchAddress" id="field_branchAddress"
                           formControlName="branchAddress"/>
                        </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchEmail" for="field_branchEmail">Branch Email</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="text"  name="branchEmail" id="field_branchEmail"
                           formControlName="branchEmail"/>
                    </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchBanner" for="field_branchBanner">Branch Banner</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="text" name="branchBanner" id="field_branchBanner"
                           formControlName="branchBanner"/>
                    </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.branch.branchDefaultExercice" for="field_branchDefaultExercice">Branch Default Exercice</mat-label>
                    <mat-form-field class="example-full-width">
                    <input matInput type="number"  name="branchDefaultExercice" id="field_branchDefaultExercice"
                           formControlName="branchDefaultExercice"/>
                    </mat-form-field>
                </div>
            </div>

            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary" (click)="previousState()">
                    <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>

                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
