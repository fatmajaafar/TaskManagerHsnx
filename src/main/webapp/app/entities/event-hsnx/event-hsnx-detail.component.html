<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="event">
            <h2><span jhiTranslate="taskManagerHsnxApp.event.detail.title">Event</span> {{ event.id }}</h2>

            <hr>

            

            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="taskManagerHsnxApp.event.eventdescription">Eventdescription</span></dt>
                <dd>
                    <span>{{ event.eventdescription }}</span>
                </dd>
                <dt><span jhiTranslate="taskManagerHsnxApp.event.starttime">Starttime</span></dt>
                <dd>
                    <span>{{ event.starttime }}</span>
                </dd>
                <dt><span jhiTranslate="taskManagerHsnxApp.event.startdate">Startdate</span></dt>
                <dd>
                    <span>{{ event.startdate }}</span>
                </dd>
                <dt><span jhiTranslate="taskManagerHsnxApp.event.endtime">Endtime</span></dt>
                <dd>
                    <span>{{ event.endtime }}</span>
                </dd>
                <dt><span jhiTranslate="taskManagerHsnxApp.event.enddate">Enddate</span></dt>
                <dd>
                    <span>{{ event.enddate }}</span>
                </dd>
                <dt><span jhiTranslate="taskManagerHsnxApp.event.tblTask">Tbl Task</span></dt>
                <dd>
                    <div *ngIf="event.tblTaskId">
                        <a [routerLink]="['/task-hsnx', event.tblTaskId, 'view']">{{ event.tblTaskTasktitle }}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/event-hsnx', event.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
            </button>
        </div>
    </div>
</div>
