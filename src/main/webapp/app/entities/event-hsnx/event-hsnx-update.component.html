<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-event-hsnx-heading" jhiTranslate="taskManagerHsnxApp.event.home.createOrEditLabel">Create or edit a Event</h2>

            <div>
                <jhi-alert-error></jhi-alert-error>

                <div class="form-group" [hidden]="!editForm.get('id')!.value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id" readonly />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.event.eventdescription" for="field_eventdescription">Eventdescription</label>
                    <input type="text" class="form-control" name="eventdescription" id="field_eventdescription"
                           formControlName="eventdescription"/>
                    <div *ngIf="editForm.get('eventdescription')!.invalid && (editForm.get('eventdescription')!.dirty || editForm.get('eventdescription')!.touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('eventdescription')?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.event.starttime" for="field_starttime">Starttime</label>
                    <div class="d-flex">
                        <input id="field_starttime" type="datetime-local" class="form-control" name="starttime" formControlName="starttime" placeholder="YYYY-MM-DD HH:mm"/>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.event.startdate" for="field_startdate">Startdate</label>
                    <div class="input-group">
                        <input id="field_startdate" type="text" class="form-control" name="startdate" ngbDatepicker #startdateDp="ngbDatepicker" formControlName="startdate"/>
                        <span class="input-group-append">
                            <button type="button" class="btn btn-secondary" (click)="startdateDp.toggle()"><fa-icon icon="calendar-alt"></fa-icon></button>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.event.endtime" for="field_endtime">Endtime</label>
                    <div class="d-flex">
                        <input id="field_endtime" type="datetime-local" class="form-control" name="endtime" formControlName="endtime" placeholder="YYYY-MM-DD HH:mm"/>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.event.enddate" for="field_enddate">Enddate</label>
                    <div class="input-group">
                        <input id="field_enddate" type="text" class="form-control" name="enddate" ngbDatepicker #enddateDp="ngbDatepicker" formControlName="enddate"/>
                        <span class="input-group-append">
                            <button type="button" class="btn btn-secondary" (click)="enddateDp.toggle()"><fa-icon icon="calendar-alt"></fa-icon></button>
                        </span>
                    </div>
                </div>
            </div>

            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary" (click)="previousState()">
                    <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>

                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
