<div class="col-lg-12 control-section">
    <div class="content-wrapper" style="margin-bottom: 25px;">
        <div class="formtitle">
            <span jhiTranslate="taskManagerHsnxApp.event.home.createOrEditLabel">Event Details</span>
        </div>

        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">

            <div class="form-group" [hidden]="!editForm.get('id')!.value">
                <mat-label for="id" jhiTranslate="global.field.id">ID</mat-label>
                <mat-form-field class="example-full-width">
                    <input matInput type="text" id="id" name="id" formControlName="id" readonly />
                </mat-form-field>
            </div>

            <div class="form-group">
                <div class="e-float-input">
                    <input type="text" name="eventdescription" id="field_eventdescription"
                        formControlName="eventdescription">
                    <span class="e-float-line"></span>
                    <label jhiTranslate="taskManagerHsnxApp.event.eventdescription" for="field_eventdescription"
                        class="e-float-text">eventdescription</label>
                </div>
                <div
                    *ngIf="editForm.get('eventdescription')!.invalid && (editForm.get('eventdescription')!.dirty || editForm.get('eventdescription')!.touched)">
                    <small class="form-text text-danger" *ngIf="editForm.get('eventdescription')?.errors?.required"
                        jhiTranslate="entity.validation.required">
                        This field is required.
                    </small>
                </div>
            </div>


            <div class="form-group">
                <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.event.starttime"
                    for="field_starttime">Starttime</label>
                <div class="d-flex">
                    <input id="field_starttime" type="datetime-local" class="form-control" name="starttime"
                        formControlName="starttime" placeholder="YYYY-MM-DD HH:mm" />
                </div>
            </div>

            <div class="form-group">
                <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.event.startdate"
                    for="field_startdate">Startdate</label>
                <div class="input-group">
                    <input id="field_startdate" type="text" class="form-control" name="startdate" ngbDatepicker
                        #startdateDp="ngbDatepicker" formControlName="startdate" />
                    <span class="input-group-append">
                        <button type="button" class="btn btn-secondary" (click)="startdateDp.toggle()">
                            <fa-icon icon="calendar-alt"></fa-icon>
                        </button>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.event.endtime"
                    for="field_endtime">Endtime</label>
                <div class="d-flex">
                    <input id="field_endtime" type="datetime-local" class="form-control" name="endtime"
                        formControlName="endtime" placeholder="YYYY-MM-DD HH:mm" />
                </div>
            </div>

            <div class="form-group">
                <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.event.enddate"
                    for="field_enddate">Enddate</label>
                <div class="input-group">
                    <input id="field_enddate" type="text" class="form-control" name="enddate" ngbDatepicker
                        #enddateDp="ngbDatepicker" formControlName="enddate" />
                    <span class="input-group-append">
                        <button type="button" class="btn btn-secondary" (click)="enddateDp.toggle()">
                            <fa-icon icon="calendar-alt"></fa-icon>
                        </button>
                    </span>
                </div>
            </div>

            <div class="form-group">

                <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.event.tblTask"
                    for="field_tblTask">Tbl Task</label>
                <select class="form-control" id="field_tblTask" name="tblTask" formControlName="tblTaskId">
                    <option [ngValue]="null"></option>
                    <option [ngValue]="TaskOption.id" *ngFor="let TaskOption of tasks; trackBy: trackById">
                        {{ TaskOption.tasktitle }}</option>
                </select>

            </div>



            <div class="row">
                <div style="width: 320px;margin:0px auto;height: 100px;padding-top: 25px;">
                    <div style="display: inline-block;">
                        <button class="samplebtn e-control e-btn e-primary" type="submit"
                            style="height:40px;width: 150px;" data-ripple="true" id="save-entity"
                            [disabled]="editForm.invalid || isSaving"> <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span></button>
                    </div>
                    <div style="float: right;">
                        <button class="samplebtn e-control e-btn" type="button" id="cancel-save"
                            (click)="previousState()" style="height:40px;width: 150px;"
                            data-ripple="true">   <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span></button>
                    </div>
                </div>
            </div>
    </div>
</div>
</form>
</div>
</div>


<div id="description">

    <style>
        .formtitle {
            width: 100%;
            text-align: center;
            padding: 10px;
            font-size: 16px;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.70);
        }

        .e-error,
        .e-float-text {
            font-weight: 500;
        }

        .e-custom-label {
            font-size: 14px;
            font-weight: 500;
            margin-left: 20px;
        }

        form {
            padding-top: 20px;
            margin-bottom: 45px;
            border: 1px solid #ccc;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.36);
            border-radius: 5px;
            background: #f9f9f9;
        }

        .highcontrast form,
        .highcontrast .header {
            color: #fff;
            background: #000000;
        }

        .header {
            color: rgba(0, 0, 0, 0.7);
        }

        table,
        td,
        th {
            padding: 5px;
        }

        .form-horizontal .form-group {
            margin-left: 20px;
            margin-right: 20px;
        }

        .row {
            padding-bottom: 30px;
            padding-top: 25px;
        }
    </style>
