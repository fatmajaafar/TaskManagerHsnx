<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
            <h2 id="jhi-department-hsnx-heading" jhiTranslate="taskManagerHsnxApp.department.home.createOrEditLabel">Create or edit a Department</h2>

            <div>
                <jhi-alert-error></jhi-alert-error>

                <div class="form-group" [hidden]="!editForm.get('id')!.value">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id" formControlName="id" readonly />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.department.deptName" for="field_deptName">Dept Name</label>
                    <input type="text" class="form-control" name="deptName" id="field_deptName"
                           formControlName="deptName"/>
                    <div *ngIf="editForm.get('deptName')!.invalid && (editForm.get('deptName')!.dirty || editForm.get('deptName')!.touched)">
                        <small class="form-text text-danger"
                               *ngIf="editForm.get('deptName')?.errors?.required" jhiTranslate="entity.validation.required">
                        This field is required.
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.department.deptNote" for="field_deptNote">Dept Note</label>
                    <input type="text" class="form-control" name="deptNote" id="field_deptNote"
                           formControlName="deptNote"/>
                </div>
            </div>

            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary" (click)="previousState()">
                    <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>

                <button type="submit" id="save-entity" [disabled]="editForm.invalid || isSaving" class="btn btn-primary">
                    <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
