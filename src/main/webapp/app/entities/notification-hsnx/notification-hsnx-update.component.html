<div class="col-lg-12 control-section">
    <div class="content-wrapper" style="margin-bottom: 25px;">
        <div class="formtitle">
            <span jhiTranslate="taskManagerHsnxApp.notification.home.createOrEditLabel">Notification Details</span>
        </div>

        <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">

            <div class="form-group" [hidden]="!editForm.get('id')!.value">
                <mat-label for="id" jhiTranslate="global.field.id">ID</mat-label>
                <mat-form-field class="example-full-width">
                <input matInput type="text"  id="id" name="id" formControlName="id" readonly />
                </mat-form-field>
            </div>

            <div class="form-group">
                <div class="e-float-input">
                    <input  name="message" id="field_message"
                    formControlName="message" type="text">
                    <span class="e-float-line"></span>
                    <label  jhiTranslate="taskManagerHsnxApp.notification.message" for="field_message" class="e-float-text">Message</label>
                </div>
               
            </div>
            

            <div class="form-group">
                    
                <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.notification.handled" for="field_handled">Handled</label>
                <input type="checkbox"  name="handled" id="field_handled"
                       formControlName="handled"/>
            </div>

            <div class="form-group">
                <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.notification.notifFrom" for="field_notifFrom">Notif From</mat-label>
                <mat-form-field class="example-full-width">
                <input matInput type="text"  name="notifFrom" id="field_notifFrom"
                       formControlName="notifFrom"/>
                </mat-form-field>
            </div>

            <div class="form-group">
                <mat-label class="form-control-label" jhiTranslate="taskManagerHsnxApp.notification.notifto" for="field_notifto">Notifto</mat-label>
                <mat-form-field class="example-full-width">
                <input matInput type="text"  name="notifto" id="field_notifto"
                       formControlName="notifto"/>
                </mat-form-field>       
            </div>

            <div class="row">
                <div style="width: 320px;margin:0px auto;height: 100px;padding-top: 25px;">
                    <div style="display: inline-block;">
                        <button id="save-entity" [disabled]="editForm.invalid || isSaving" class="samplebtn e-control e-btn e-primary" type="submit" style="height:40px;width: 150px;" data-ripple="true"><fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span></button>
                    </div>
                    <div style="float: right;">
                        <button type="button" id="cancel-save" class="btn btn-secondary" (click)="previousState()" class="samplebtn e-control e-btn" style="height:40px;width: 150px;" data-ripple="true"><fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span></button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>


<div id="description">

<style>
    .formtitle {
        width: 100%;
        text-align: center;
        padding: 10px;
        font-size: 16px;
        font-weight: 500;
        color: rgba(0, 0, 0, 0.70);
    }

    .e-error,
    .e-float-text {
        font-weight: 500;
    }

    .e-custom-label {
        font-size: 14px;
        font-weight: 500;
        margin-left: 20px;
    }

    form {
        padding-top: 20px;
        margin-bottom: 45px;
        border: 1px solid #ccc;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.36);
        border-radius: 5px;
        background: #f9f9f9;
    }

    .highcontrast form,
    .highcontrast .header {
        color: #fff;
        background: #000000;
    }

    .header {
        color: rgba(0, 0, 0, 0.7);
    }

    table,
    td,
    th {
        padding: 5px;
    }

    .form-horizontal .form-group {
        margin-left: 20px;
        margin-right: 20px;
    }

    .row {
        padding-bottom: 30px;
        padding-top: 25px;
    }
</style>
