<div class="task-form-wrapper">

  <mat-toolbar color="warn" style="background-color:#880e4f">

    <span class="material-icons">
      check_circle
    </span>

    <h5>Add New To Do</h5>
    &nbsp;
  
      <button type="submit" aria-hidden="true">&times;</button>

  </mat-toolbar>

  <mat-card>

    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">

      <div class="input-full-width">
        <textarea matInput type="text" name="tasktitle" formControlName="tasktitle" maxlength="500" minlength="5"
          placeholder="What needs to be done?" autocomplete="off" autofocus class="task-form__input"></textarea>
        <br>
        <div class="form-group">
          <label class="form-control-label" jhiTranslate="taskManagerHsnxApp.task.dateStart" for="field_dateStart">Date
            Start</label>
          <div class="input-group">

            <input id="field_dateStart" type="text" class="form-control" name="dateStart" ngbDatepicker
              #dateStartDp="ngbDatepicker" formControlName="dateStart" />
            <span class="input-group-append">
              <button type="button" class="btn btn-secondary" (click)="dateStartDp.toggle()">
                <fa-icon icon="calendar-alt"></fa-icon>
              </button>
            </span>
          </div>
        </div>

        <div class="form-group">
          <mat-form-field color="accent">
            <mat-label jhiTranslate="taskManagerHsnxApp.task.taskcategory" for="field_taskcategory">Category</mat-label>
            <mat-select name="taskcategory" id="field_taskcategory" formControlName="taskcategory">
              <mat-option value="1">Important</mat-option>
              <mat-option value="2">Notes</mat-option>
              <mat-option value="3">Links</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        
        <button ejs-button cssClass="e-outline" [isPrimary]="true" type="submit" id="save-entity"
          [disabled]=" isSaving">
          <fa-icon icon="save"></fa-icon>&nbsp;<span>Save</span>
        </button>
        <button ejs-button>
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>
      </div>

    </form>
  </mat-card>
