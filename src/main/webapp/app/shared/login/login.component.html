<img class="wave" src="../../../content/images/login/wave.png">
<div class="container">
    <div class="img">
        <img src="../../../content/images/login/bg.svg">
    </div>
    <div class="login-content">
        <form role="form" (ngSubmit)="login()" [formGroup]="loginForm">
            <img src="../../../content/images/login/avatar.svg">
            <h2 class="title">Hosinox Web Task Manager</h2>
            <div class="input-div one">
                <div class="i">
                    <i class="fas fa-user"></i>
                </div>
                <div class="div">
                    <h5>Username</h5>
                    <input type="text" class="form-control" name="username" id="username"  formControlName="username"
                         >
                </div>
            </div>
            <div class="input-div pass">
                <div class="i">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="div">
                    <h5>Password</h5>
                    <input type="password" class="form-control" name="password" id="password" 
                            formControlName="password">
                </div>
            </div>
            
            <a   jhiTranslate="login.password.forgot">Did you forget your password?</a>
            <input type="submit" class="btn" jhiTranslate="login.form.button" value="Login">
            <div class="form-check">
                <label class="form-check-label" for="rememberMe">
                    <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" >
                    <span jhiTranslate="login.form.rememberme">Remember me</span>
                </label>
            </div>
        </form>
    </div>
</div>
</body>
