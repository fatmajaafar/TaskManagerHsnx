<img class="wave" src="../../../content/images/login/wavve.svg">
<div class="container">
    <div class="img">
        <img src="../../../content/images/login/mobile icone.svg">
    </div>
    <div class="login-content">
        <form role="form" (ngSubmit)="login()" [formGroup]="loginForm">
            <img src="../../../content/images/login/emp.svg">
            <mat-card>
                <mat-card-title>Login</mat-card-title>
          <mat-card-content>
            
                  <!--<h5>Username</h5>-->  
                  <p>
                  <mat-form-field >
                    
                    <input matInput  type="text" name="username" id="username"  formControlName="username" placeholder="E-mail" >
                  </mat-form-field>
                
                  </p>

               <p>
                <!--<h5>Password</h5>-->    
                <mat-form-field >
                   
                    <input matInput type="password" name="password" id="password" 
                            formControlName="password" placeholder="Password">
                      
                </mat-form-field>            
            </p>
            
           
            <a class="alert-link" (click)="requestResetPassword()" jhiTranslate="login.password.forgot">Forgot password?</a>
            <input type="submit" class="btn" jhiTranslate="login.form.button" value="Sign in">
            <div class="form-check">
                <label class="form-check-label" for="rememberMe">
                    <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" >
                    <span jhiTranslate="login.form.rememberme">Remember me</span>
                </label>
            </div>
            <hr>
           <div><span jhiTranslate="global.messages.info.register.noaccount">You don't have an account yet?</span>
            <a class="alert-link" (click)="register()" jhiTranslate="global.messages.info.register.link">Register a new account</a></div> 
        </mat-card-content>
    </mat-card>
            
        </form>
        
    </div>
</div>
</body>
