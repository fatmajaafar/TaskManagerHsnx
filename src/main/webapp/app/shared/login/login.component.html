<img class="wave" src="../../../content/images/login/wavve.svg">
<div class="container">
    <div class="img">
        <img src="../../../content/images/login/mobile icone.svg">
    </div>
    <div class="login-content">
        <form role="form" (ngSubmit)="login()" [formGroup]="loginForm">
            <img src="../../../content/images/login/usericon.png">
         <strong> <h2 class="title">Sign in</h2></strong>
            <div class="input-div one">
                <div class="i">
                    <i class="fas fa-user"></i>
                </div>
                <div class="div">
                  <!--<h5>Username</h5>-->  
                    <input type="text" class="form-control" name="username" id="username"  formControlName="username" placeholder="E-mail"  >
                </div>
            </div>
            <div class="input-div pass">
                <div class="i">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="div">
                <!--<h5>Password</h5>-->    
                    <input type="password" class="form-control" name="password" id="password" 
                            formControlName="password" placeholder="Password">
                </div>
            </div>
            
           
            <a jhiTranslate="login.password.forgot">Forgot password?</a>
            <input type="submit" class="btn" jhiTranslate="login.form.button" value="Sign in">
            <div class="form-check">
                <label class="form-check-label" for="rememberMe">
                    <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" >
                    <span jhiTranslate="login.form.rememberme">Remember me</span>
                </label>
            </div>

            
        </form>
        
    </div>
</div>
</body>
