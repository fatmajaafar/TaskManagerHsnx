<div class="row">
	<div style="border-right: 2px dashed grey" class="col-md-2">
	
		<span class="hipster img-fluid rounded"></span>
		<p class="lead">
			<div [ngSwitch]="isAuthenticated()">
				<div class="alert alert-success" *ngSwitchCase="true">
					<span id="home-logged-message" *ngIf="account" jhiTranslate="home.logged.message"
						[translateValues]="{ username: account.login }">You are logged in as "{{ account.login }}".</span>
				</div>
			</div>
	    </p>
	</div>
	<div  class="col-10">
		
	<div  class="row">
		<div  class="col-md-6">
		<div>
		  <div style="display: block">
			<canvas baseChart
			  [datasets]="barChartData"
			  [labels]="barChartLabels"
			  [options]="barChartOptions"
			  [legend]="barChartLegend"
			  [chartType]="barChartType">
			</canvas>
		  </div>
		</div>
	  	</div>
	  	<div  class="col-md-6">
		  	<div style="display: block">
				<canvas baseChart
				  [datasets]="barChartData"
				  [labels]="barChartLabels"
				  [options]="barChartOptions"
				  [legend]="barChartLegend"
				  [chartType]="barChartType">
				</canvas>
		  	</div>
		</div>
	</div>

	<br />
	<div class="row">
		<div  class="col-md-6">
		  <div style="display: block">
		    <canvas baseChart
			  [data]="polarAreaChartData"
			  [labels]="polarAreaChartLabels"
			  [legend]="polarAreaLegend"
			  [chartType]="polarAreaChartType">
			</canvas>
		  </div>
		</div>
		<br/>
		<div class="col-md-6" >
			<div style="display: block">
				<canvas baseChart
				  [data]="pieChartData"
				  [labels]="pieChartLabels"
				  [chartType]="pieChartType"
				  [options]="pieChartOptions"
				  [plugins]="pieChartPlugins"
				  [colors]="pieChartColors"
				  [legend]="pieChartLegend">
				</canvas>
			</div>
		</div>


	</div> 

	</div>
</div>
